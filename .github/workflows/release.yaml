name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # No cgo, so build.sh cross-compiles every target from one runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check tag matches versioninfo.json
        run: |
          v=v$(jq -r .StringFileInfo.ProductVersion versioninfo.json)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::versioninfo.json is $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          GOARCH=amd64 ./build.sh windows && mv pub2pdf.exe   dist/pub2pdf.exe
          GOARCH=arm64 ./build.sh windows && mv pub2pdf.exe   dist/pub2pdf-arm64.exe
          GOARCH=arm64 ./build.sh mac     && mv pub2pdf-mac   dist/pub2pdf-mac
          GOARCH=amd64 ./build.sh mac     && mv pub2pdf-mac   dist/pub2pdf-mac-intel
          GOARCH=amd64 ./build.sh linux   && mv pub2pdf-linux dist/pub2pdf-linux
          GOARCH=arm64 ./build.sh linux   && mv pub2pdf-linux dist/pub2pdf-linux-arm64
      - name: Package Mac and Linux
        # A bare download loses the executable bit; tar keeps it
        working-directory: dist
        run: for f in pub2pdf-mac* pub2pdf-linux*; do tar czf "$f.tar.gz" "$f" && rm "$f"; done
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
